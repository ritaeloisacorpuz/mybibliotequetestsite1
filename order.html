<!DOCTYPE html>
<html lang="en">

    .order-page-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: inherit;
    }

    /* Order Form Wrapper - Black Theme */
    .order-form-wrapper {
      max-width: 650px;
      margin: 20px auto 60px auto;
      text-align: center;
    }

    .form-heading {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: bold;
      font-size: 2.2rem;
      color: #111111;
      margin-bottom: 30px;
    }

    .form-group-row {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1;
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #333;
      margin-bottom: 6px;
      font-weight: 400;
    }

    /* Input & Textarea Explicit Styling (Sleek Neutral Gray) */
    .form-control {
      width: 100%;
      height: 42px;
      padding: 8px 14px;
      background-color: #f4f4f4;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
      color: #111;
      display: block;
    }

    .form-control:focus {
      outline: none;
      background-color: #ffffff;
      border-color: #111111;
    }

    textarea.form-control {
      height: 140px !important;
      resize: vertical;
      padding-top: 10px;
    }

    /* Submit Button (Pure Black Theme) */
    .btn-submit-black {
      width: 100%;
      background-color: #1a1a1a;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit-black:hover {
      background-color: #333333;
    }

    /* Receipt Upload Section */
    .receipt-section {
      margin-top: 50px;
      text-align: center;
    }

    .receipt-note {
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 20px;
    }

      max-width: 320px;

      text-align: left;
    }

      font-weight: bold;
      font-size: 0.75rem;
      display: block;
      margin-bottom: 5px;
    }
