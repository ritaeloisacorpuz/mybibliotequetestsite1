<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order & Payment Instructions - myBiblioteque</title>
  
  <!-- 1. External Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    .order-page-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: inherit;
    }

    /* Order Form Wrapper - Black Theme */
    .order-form-wrapper {
      max-width: 650px;
      margin: 20px auto 60px auto;
      text-align: center;
    }

    .form-heading {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: bold;
      font-size: 2.2rem;
      color: #111111;
      margin-bottom: 30px;
    }

    .form-group-row {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1;
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #333;
      margin-bottom: 6px;
      font-weight: 400;
    }

    /* Input & Textarea Explicit Styling */
    .form-control {
      width: 100%;
      height: 42px;
      padding: 8px 14px;
      background-color: #e5ebe6;
      border: 1px solid #d0d8d2;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
      color: #111;
      display: block;
    }

    .form-control:focus {
      outline: none;
      background-color: #dce4dd;
      border-color: #111;
    }

    textarea.form-control {
      height: 140px !important;
      resize: vertical;
      padding-top: 10px;
    }

    /* Submit Button (Black Theme) */
    .btn-submit-black {
      width: 100%;
      background-color: #2b4c38; /* You can change to #1a1a1a for pure black */
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit-black:hover {
      background-color: #1e3728;
    }

    /* Receipt Upload Section */
    .receipt-section {
      margin-top: 50px;
      text-align: center;
    }

    .receipt-note {
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 20px;
    }

    .email-input-box {
      max-width: 320px;
      margin: 0 auto 20px auto;
      text-align: left;
    }

    .email-input-box label {
      font-weight: bold;
      font-size: 0.75rem;
      display: block;
      margin-bottom: 5px;
    }

    .btn-upload-dark {
      background-color: #2c9384;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .receipt-instructions {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .section-divider {
      border: 0;
      height: 1px;
      background: #e0e0e0;
      margin: 60px 0;
    }

    /* Step-by-Step Instructions Styling */
    .order-page-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 300;
      color: #111;
      margin-bottom: 40px;
    }

    .step-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 50px;
      padding-bottom: 40px;
      border-bottom: 1px solid #f0f0f0;
    }

    .step-block.reverse {
      flex-direction: row-reverse;
    }

    .step-text { flex: 1; }
    .step-number {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    .step-title {
      font-size: 1.3rem;
      letter-spacing: 1px;
      font-weight: 400;
      color: #111;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .step-description {
      font-size: 0.85rem;
      line-height: 1.7;
      color: #555;
    }

    .step-image {
      flex: 1;
      max-width: 400px;
    }

    .step-image img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .step-block, .step-block.reverse {
        flex-direction: column;
        text-align: center;
      }
      .form-group-row {
        flex-direction: column;
        gap: 0;
      }
      .step-image { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <main class="order-page-container">
    
    <!-- 1. ORDER FORM (ON TOP) -->
    <div class="order-form-wrapper">
      <h1 class="form-heading">Order Form</h1>

      <form action="https://contactformhandler.rita-eloisa-corpuz.workers.dev" method="POST" enctype="multipart/form-data">
        
        <!-- Row 1: First & Last Name -->
        <div class="form-group-row">
          <div class="form-group">
            <label for="first_name">First name *</label>
            <input type="text" id="first_name" name="first_name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" class="form-control">
          </div>
        </div>

        <!-- Row 2: Email & Phone -->
        <div class="form-group-row">
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" class="form-control">
          </div>
        </div>

        <!-- Row 3: Order Details Textarea -->
        <div class="form-group">
          <label for="order_details">Indicate below the Title, Author &amp; Book Number of the book or Netclip you want to order</label>
          <textarea id="order_details" name="order_details" class="form-control"></textarea>
        </div>

        <!-- Submit Button 1 -->
        <button type="submit" class="btn-submit-black">Submit</button>

        <!-- RECEIPT UPLOAD SECTION -->
        <div class="receipt-section">
          <p class="receipt-note">Kindly input the e-mail where you want the eBook or Netclip to be sent.</p>
          
          <div class="email-input-box">
            <label for="delivery_email">Email</label>
            <input type="email" id="delivery_email" name="delivery_email" class="form-control" style="background:#fff; border:1px solid #ccc;" placeholder="example@domain.com">
          </div>

          <label class="btn-upload-dark">
            + Upload It
            <input type="file" name="payment_receipt" accept="image/*,.pdf" style="display: none;">
          </label>

          <p class="receipt-instructions">
            Upload the payment receipt screenshot here.<br>
            Please write your e-mail address on the screenshot before uploading.
          </p>

          <!-- Submit Button 2 -->
          <button type="submit" class="btn-submit-black" style="max-width: 200px;">Submit</button>
        </div>

      </form>
    </div>

    <hr class="section-divider">

    <!-- 2. INSTRUCTIONS SECTION (BELOW FORM) -->
    <h2 class="order-page
