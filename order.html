<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order & Payment Instructions - myBiblioteque</title>
  
  <!-- 1. External Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Internal Page Styles for Form & Instructions Layout -->
  <style>
    .order-page-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: inherit;
    }

    /* Order Form Styling - Sleek Black Theme */
    .order-form-wrapper {
      max-width: 650px;
      margin: 20px auto 70px auto;
      text-align: center;
    }

    .form-heading {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 2.2rem;
      color: #111111; /* Black color */
      margin-bottom: 30px;
    }

    .form-group-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1;
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #333;
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #f2f2f2;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
      color: #111;
    }

    .form-control:focus {
      outline: none;
      background-color: #e8e8e8;
      border-color: #111;
    }

    textarea.form-control {
      height: 120px;
      resize: vertical;
    }

    /* Primary Submit Button (Black) */
    .btn-submit-black {
      width: 100%;
      background-color: #1a1a1a;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit-black:hover {
      background-color: #333333;
    }

    /* Receipt Upload Section */
    .receipt-section {
      margin-top: 50px;
      text-align: center;
    }

    .receipt-note {
      font-size: 0.85rem;
      color: #444;
      margin-bottom: 20px;
    }

    .email-input-box {
      max-width: 320px;
      margin: 0 auto 20px auto;
      text-align: left;
    }

    .btn-upload-dark {
      background-color: #2b2b2b;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      transition: background-color 0.2s ease;
    }

    .btn-upload-dark:hover {
      background-color: #444444;
    }

    .receipt-instructions {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Section Divider Line */
    .section-divider {
      border: 0;
      height: 1px;
      background: #e0e0e0;
      margin: 60px 0 50px 0;
    }

    /* Order & Payment Instructions Header */
    .order-page-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 300;
      color: #111;
      margin-bottom: 40px;
      padding-bottom: 15px;
    }

    /* Step Blocks */
    .step-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 50px;
      padding-bottom: 40px;
      border-bottom: 1px solid #f0f0f0;
    }

    .step-block.reverse {
      flex-direction: row-reverse;
    }

    .step-text {
      flex: 1;
    }

    .step-number {
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    .step-title {
      font-size: 1.4rem;
      letter-spacing: 1px;
      font-weight: 400;
      color: #111;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .step-description {
      font-size: 0.85rem;
      line-height: 1.7;
      color: #555;
    }

    .step-image {
      flex: 1;
      max-width: 400px;
    }

    .step-image img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 4px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .step-block, .step-block.reverse {
        flex-direction: column;
        text-align: center;
      }
      .form-group-row {
        flex-direction: column;
        gap: 0;
      }
      .step-image {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>
