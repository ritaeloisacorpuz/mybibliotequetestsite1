<!DOCTYPE html>
<html lang="en">

  <style>
    .etraining-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 50px 20px 90px 20px;
      font-family: inherit;
      color: #333;
    }

    /* SECTION 1 (etraining1): Anatomy of Learning a Language */
    .anatomy-section {
      text-align: center;
      margin-bottom: 90px;
    }

    .anatomy-title {
      font-size: 2.2rem;
      font-weight: 300;
      color: #222;
      margin-bottom: 50px;
      letter-spacing: 0.5px;
    }

    .anatomy-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      max-width: 800px;
      margin: 0 auto;
    }

    .anatomy-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 280px;
      text-align: right;
      width: 220px;
    }

    .label-item {
      position: relative;
      font-size: 0.82rem;
      color: #666;
      line-height: 1.35;
    }

    .label-item span {
      display: block;
    }

    /* Connecting Lines from Text to Book Layers */
    .label-item::after {
      content: "";
      position: absolute;
      right: -110px;
      top: 50%;
      width: 90px;
      height: 1px;
      background-color: #d0d0d0;
    }

    .color-dots {
      display: flex;
      gap: 5px;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-cyan { background-color: #8ed0d8; }
    .dot-yellow { background-color: #f7d870; }
    .dot-pink { background-color: #f1a1b4; }
    .dot-green { background-color: #92ca7c; }
    .dot-dark { background-color: #2b3a42; }

    .anatomy-image {
      max-width: 380px;
      margin-left: 90px;
    }

    .anatomy-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SECTION 2 (etraining2): See the world like a local Grid */

      margin-bottom: 100px;
    }

    .guides-header {
      margin-bottom: 45px;
    }

    .guides-title {
      font-size: 2.2rem;
      font-weight: 300;
      color: #222;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .guides-subtitle {
      font-size: 0.85rem;
      color: #777;
    }

    .guides-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .guide-card {
      text-align: left;
    }

    .guide-card-banner {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    /* Card Banner Color Variants */
    .banner-cavant { background-color: #f2f1ed; color: #222; }
    .banner-dark { background-color: #212121; color: #fff; }
    .banner-light { background-color: #e9e8e4; color: #222; }
    .banner-green { background-color: #8cbd1b; color: #111; }
    .banner-orange { background-color: #f06724; color: #fff; }

    .banner-text-logo {
      font-family: serif;
      text-align: center;
      font-weight: bold;
    }

    .guide-card-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #222;
      margin-bottom: 2px;
    }

    .guide-card-sub {
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .guide-card-desc {
      font-size: 0.75rem;
      line-height: 1.5;
      color: #777;
    }

    /* SECTION 3 (etraining3): 6-Step Process Grid */

    }

      margin: 0 auto;
    }

      text-align: center;

      flex-direction: column;
      align-items: center;
    }

      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
